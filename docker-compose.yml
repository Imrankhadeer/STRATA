services:
  db:
    image: postgres:16-alpine
    container_name: cyber_engine_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-cyber_engine}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-cyber_engine}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: cyber_engine_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "512mb", "--maxmemory-policy", "volatile-lru"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cyber_engine_backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql+psycopg2://postgres:postgres@db:5432/cyber_engine
      - REDIS_URL=redis://redis:6379/0
      - ENVIRONMENT=${ENVIRONMENT:-development}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - SECRET_KEY=${SECRET_KEY:-cyber-engine-dev-insecure-secret-key-32chars}
      - INVESTIGATOR_PROVIDER=${INVESTIGATOR_PROVIDER:-muse}
      - INVESTIGATOR_BASE_URL=${INVESTIGATOR_BASE_URL:-https://api.meta.ai/v1}
      - INVESTIGATOR_MODEL=${INVESTIGATOR_MODEL:-muse-spark-1.3}
      - INVESTIGATOR_API_KEY=${INVESTIGATOR_API_KEY:-${MUSE_API_KEY:-}}
    volumes:
      - ./backend:/app/backend
      - ./sdk:/app/sdk
      - ./scenarios:/app/scenarios
      - ./index.html:/app/index.html
      - ./console.html:/app/console.html
      - ./docs.html:/app/docs.html
      - ./docker-entrypoint.sh:/app/docker-entrypoint.sh

volumes:
  postgres_data:
  redis_data:
