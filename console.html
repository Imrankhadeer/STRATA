/* ===== Ternline application shell ===== */
.hidden{display:none!important}
.landing{min-height:100vh;background:radial-gradient(900px 420px at 80% -80px,#1c2a20 0%,transparent 60%),radial-gradient(700px 380px at 10% 10%,#14271c 0%,transparent 55%),var(--bg)}
.lnav{max-width:1180px;margin:auto;display:flex;align-items:center;gap:14px;padding:20px 24px}
.lnav .links{margin-left:auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.hero{max-width:1180px;margin:auto;padding:56px 24px 20px;display:grid;grid-template-columns:1.15fr .85fr;gap:26px;align-items:start}
.hero h1{font-size:clamp(30px,4.4vw,52px);line-height:1.04;margin:12px 0;letter-spacing:-.045em}
.hero h1 em{font-style:normal;color:var(--lime)}
.hero p.lead{color:var(--muted);font-size:14px;max-width:620px}
.ctaRow{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}
.trustRow{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
.featGrid{max-width:1180px;margin:auto;padding:22px 24px;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:13px}
.featGrid .panel{padding:15px}
.featGrid h3{margin:0 0 6px;font-size:13px}
.featGrid p{margin:0;color:var(--muted);font-size:11px}
.flowSec,.ctaSec{max-width:1180px;margin:auto;padding:10px 24px 26px}
.flowSteps{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:13px}
.flowSteps .panel{padding:15px}
.flowSteps b.num{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:8px;background:var(--lime);color:#15200e;margin-bottom:8px}
.lfoot{border-top:1px solid var(--line);margin-top:18px;padding:18px 24px;color:var(--muted);font-size:11px}
.lfoot .in{max-width:1180px;margin:auto;display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.authWrap{min-height:100vh;display:grid;place-items:center;padding:28px 16px;background:radial-gradient(800px 400px at 50% -100px,#1c2a20,transparent),var(--bg)}
.authCard{width:min(460px,94vw);background:var(--panel);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);overflow:hidden}
.authTabs{display:flex;border-bottom:1px solid var(--line)}
.authTabs button{flex:1;background:transparent;border:0;color:var(--muted);padding:12px;font-weight:700}
.authTabs button.active{color:var(--lime);box-shadow:inset 0 -2px 0 var(--lime)}
.userchip{display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--panel);border-radius:20px;padding:4px 10px 4px 4px;font-size:11px}
.avatar{width:24px;height:24px;border-radius:50%;background:var(--lime);color:#15200e;display:grid;place-items:center;font-weight:800;font-size:11px}
.toast{position:fixed;right:16px;bottom:16px;background:#101a14;border:1px solid var(--line);padding:10px 13px;border-radius:10px;z-index:60;box-shadow:var(--shadow)}
.toast.hide{display:none}
.drawer{position:fixed;top:0;right:0;width:min(560px,94vw);height:100vh;background:var(--side);border-left:1px solid var(--line);z-index:50;overflow:auto;padding:18px}
.modalBack{position:fixed;inset:0;background:#000a;z-index:50;display:grid;place-items:center;padding:16px}
.modal{width:min(640px,94vw);background:var(--panel);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.mobilemenu{display:none}
.empty{padding:22px;color:var(--muted);text-align:center}
.graph{display:grid;grid-template-columns:1fr auto 1fr auto 1fr auto 1fr;gap:8px;align-items:center}
.node{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:10px;text-align:center}
.node small{display:block;color:var(--muted)}
.grapharrow{color:var(--dim)}
@media(max-width:980px){.hero{grid-template-columns:1fr}.featGrid{grid-template-columns:repeat(2,minmax(0,1fr))}.flowSteps{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:720px){.featGrid,.flowSteps{grid-template-columns:1fr}.lnav .links .hideM{display:none}}

/* ===== Ternline control-room visual components ===== */
.ce-note{font-size:10px;color:var(--dim)}
.ce-chain{display:flex;flex-direction:column;gap:0;margin-top:10px}
.ce-node{border:1px solid var(--line);background:var(--panel2);border-radius:10px;padding:10px 12px;margin-bottom:8px}
.ce-node .ce-meta{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:6px}
.ce-link{color:var(--dim);text-align:center;font-size:11px;line-height:1;margin:2px 0 8px}
.ce-tl{border-left:2px solid #435344;margin:10px 0 0 6px;padding-left:16px}
.ce-tl-item{position:relative;padding:0 0 14px 4px}
.ce-tl-item:before{content:"";position:absolute;left:-22px;top:4px;width:9px;height:9px;border-radius:50%;background:var(--lime);border:2px solid var(--panel)}
.ce-tl-item.fast:before{background:var(--lime)}
.ce-tl-item.deep:before{background:var(--purple)}
.ce-tl-item.human:before{background:var(--amber)}
.ce-map{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-top:10px}
.ce-svc{border:1px solid var(--line);background:var(--panel2);border-radius:10px;padding:10px;text-align:center}
.ce-svc b{display:block;font-size:11px}

.ce-step{flex:1;min-width:110px;color:var(--muted)}
.ce-step.done{border-color:#315b43;color:var(--green)}
.ce-step.now{border-color:var(--lime);color:var(--lime)}
.ce-bar{height:7px;background:#26342b;border-radius:9px;overflow:hidden;margin-top:6px}
.ce-bar>i{display:block;height:100%;background:var(--lime)}
.ce-legend{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.ce-kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;margin-top:10px}
.ce-kv .cell{border:1px solid var(--line);border-radius:8px;padding:8px;background:var(--panel2)}
.ce-kv .cell b{display:block;font-size:16px}
.ce-ctx{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.fasttag{border-color:#315b43!important;color:var(--green)!important}
.deeptag{border-color:#51406e!important;color:var(--purple)!important}


/* Ternline capability additions */
.feature-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.feature-card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px;min-width:0}.feature-card h3{margin:0 0 6px;font-size:13px}.feature-card p{color:var(--muted);margin:0 0 12px;font-size:11px}.feature-kicker{font-size:9px;letter-spacing:.12em;text-transform:uppercase;color:var(--dim);margin-bottom:7px}.entity-node{border:1px solid var(--line);background:var(--panel2);border-radius:9px;padding:10px;min-width:0}.entity-node b{display:block;font-size:11px}.entity-node small{color:var(--muted);display:block;overflow-wrap:anywhere}.entity-link{display:flex;align-items:center;gap:8px;padding:7px 0;border-bottom:1px solid var(--line)}.entity-link:last-child{border:0}.entity-link .arrow{color:var(--lime)}.statusline{display:flex;align-items:center;gap:7px;color:var(--muted);font-size:10px}.statusline:before{content:"";width:6px;height:6px;border-radius:50%;background:var(--amber)}.statusline.ready:before{background:var(--green)}.plan-step{display:flex;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}.plan-step:last-child{border:0}.stepnum{width:22px;height:22px;border-radius:7px;background:var(--panel3);display:grid;place-items:center;color:var(--lime);font-weight:800;font-size:10px;flex:none}.range-run{border:1px solid #435b37;background:#172318;border-radius:10px;padding:12px}.tag-preview{font-size:9px;letter-spacing:.08em;border:1px solid #705a32;color:var(--amber);border-radius:5px;padding:3px 6px;text-transform:uppercase}.integration-row{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line)}.integration-row:last-child{border:0}
.timebar{display:flex;gap:8px;flex-wrap:wrap;align-items:end}.timebar .field{flex:1;min-width:145px;margin:0}.timebar .field input,.timebar .field select{width:100%}.time-presets{display:flex;gap:6px;flex-wrap:wrap}.time-presets .btn.active{border-color:var(--lime);color:var(--lime);background:#1b2a1d}.result-meta{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:10px 0}.intel-card{border:1px solid var(--line);background:var(--panel2);border-radius:9px;padding:12px}.intel-card h4{margin:0 0 5px;font-size:12px}.intel-card p{margin:0;color:var(--muted);font-size:10px}
@media(max-width:900px){.feature-grid{grid-template-columns:1fr 1fr}}@media(max-width:600px){.feature-grid{grid-template-columns:1fr}}


.sidebar-tooltip{position:fixed;z-index:99999;max-width:220px;background:#0c140e;border:1px solid #2d4233;border-radius:5px;padding:5px 9px;box-shadow:0 8px 24px rgba(0,0,0,.85),0 0 0 1px rgba(183,243,107,.2);pointer-events:none;font-family:inherit;font-size:11px;font-weight:500;color:#c9d9cb;line-height:1.35;white-space:nowrap;transition:opacity .12s ease}.sidebar-tooltip.hide{display:none!important}

<script>
(() => {
'use strict';

const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

// Centralized Connection Configuration
const storeKey = 'ternline-connection-config-v2';
const defaultBaseUrl = (function() {
  if (typeof window !== 'undefined') {
    if (window.ENV_BACKEND_URL) return window.ENV_BACKEND_URL;
    const lsBackend = localStorage.getItem('ternline_backend_url');
    if (lsBackend) return lsBackend;
    if (window.location && window.location.origin && window.location.origin.startsWith('http')) {
      return window.location.origin;
    }
  }
  return 'http://localhost:8000';
})();

const defaults = {
  baseUrl: defaultBaseUrl,
  health: '/health',
  overview: '/api/v1/ops/overview',
  events: '/api/v1/events',
  findings: '/api/v1/findings',
  investigations: '/api/v1/investigations',
  rules: '/api/v1/rules',
  historical: '/api/v1/events/search',
  streamTicket: '/api/v1/ops/stream-ticket',
  eventsStream: '/api/v1/ops/events/stream',
  recentAudit: '/api/v1/ops/events/recent',
  threatIntel: '/api/v1/threat-intelligence',
  assets: '/api/v1/keys',
  coverage: '',
  hunting: '',
  activeDefense: '/api/v1/defense/actions',
  defensePolicy: '/api/v1/defense/policy',
  defenseAudit: '/api/v1/defense/audit',
  integrations: ''
};

let config = { ...defaults };
try {
  const saved = JSON.parse(localStorage.getItem(storeKey) || '{}');
  config = { ...config, ...saved };
} catch (_) {}

// Security Rule: Bearer token is stored strictly in JavaScript session memory (never in localStorage/sessionStorage)
let bearerToken = '';
let currentTenant = 'Unauthenticated';
let page = 'overview';
let toastTimer = null;
let cache = {};
let loading = false;
let lastError = '';
let eventSource = null;
let sseConnected = false;

const titles = {
  overview: 'Operations / Overview',
  incidents: 'Operations / Incidents',
  findings: 'Operations / Findings',
  events: 'Operations / Event Explorer',
  hunting: 'Operations / Threat Hunting',
  historical: 'Threat Intelligence / Historical Analysis',
  threatIntel: 'Threat Intelligence / Intelligence Feed',
  investigations: 'Operations / Deep Investigations',
  entities: 'Explore / Entity Explorer',
  correlation: 'Detection / Correlation Engine',
  rules: 'Engineering / Rule Registry',
  coverage: 'Engineering / Detection Coverage',
  assets: 'Engineering / Assets & Identity',
  health: 'Operations / Ingestion & Health',
  audit: 'Trust / Audit & Evidence',
  defense: 'Response / Active Defense',
  integrations: 'Platform / Integrations',
  governance: 'Trust / AI Governance',
  settings: 'Platform / Backend & Settings'
};

const readPages = {
  overview: 'overview',
  findings: 'findings',
  events: 'events',
  investigations: 'investigations',
  rules: 'rules',
  health: 'health',
  audit: 'recentAudit',
  defense: 'activeDefense',
  assets: 'assets'
};

function toast(s) {
  const el = $('#toast');
  if (!el) return;
  el.textContent = s;
  el.classList.remove('hide');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.add('hide'), 3400);
}

function persist() {
  try {
    const safe = { ...config };
    localStorage.setItem(storeKey, JSON.stringify(safe));
  } catch (_) {}
}

function endpoint(k) {
  return String(config[k] || '').trim();
}

function apiUrl(path) {
  const base = String(config.baseUrl || defaultBaseUrl).trim().replace(/\/$/, '');
  if (!base) throw new Error('Backend base URL is not configured. Open Backend & Settings.');
  if (!path) throw new Error('This API route is not configured.');
  if (/^https?:\/\//i.test(path)) return path;
  return base + '/' + path.replace(/^\//, '');
}

// Format ISO UTC timestamp to user local timezone safely
function formatLocalTime(isoUtc) {
  if (!isoUtc) return '—';
  try {
    const d = new Date(isoUtc);
    if (isNaN(d.getTime())) return String(isoUtc);
    return d.toLocaleString(undefined, {
      year: 'numeric',
      month: 'short',
      day: '2-digit',
      hour: '2-digit',
      minute: '2-digit',
      second: '2-digit',
      hour12: false
    });
  } catch (_) {
    return String(isoUtc);
  }
}

// Centralized Reusable API Request Client with AbortController Timeout
async function request(path, { method = 'GET', body = null, timeoutMs = 12000 } = {}) {
  const url = apiUrl(path);
  const controller = new AbortController();
  const timer = setTimeout(() => controller.abort(), timeoutMs);

  const headers = { 'Accept': 'application/json' };
  if (bearerToken) {
    headers['Authorization'] = 'Bearer ' + bearerToken;
  }
  if (body !== null) {
    headers['Content-Type'] = 'application/json';
  }

  let res;
  try {
    res = await fetch(url, {
      method,
      headers,
      body: body !== null ? JSON.stringify(body) : undefined,
      signal: controller.signal,
      mode: 'cors',
      cache: 'no-store'
    });
  } catch (err) {
    clearTimeout(timer);
    if (err.name === 'AbortError') {
      throw new Error(`Request timed out after ${timeoutMs / 1000}s. Check server latency at ${url}`);
    }
    throw new Error(`Network/CORS error: ${err.message}. Check backend availability at ${config.baseUrl}`);
  }
  clearTimeout(timer);

  const text = await res.text();
  let data = null;
  try {
    data = text ? JSON.parse(text) : null;
  } catch (_) {
    data = { raw: text };
  }

  if (!res.ok) {
    if (res.status === 401) {
      setConnection(false, 'Unauthenticated');
      throw new Error('HTTP 401 Unauthorized: Valid Bearer token required. Configure your API key in Backend & Settings.');
    }
    const detail = data?.detail || data?.message || res.statusText || `HTTP ${res.status}`;
    throw new Error(`HTTP ${res.status}: ${detail}`);
  }

  return data;
}

function unwrap(data, keys = []) {
  if (Array.isArray(data)) return data;
  for (const k of keys) {
    if (Array.isArray(data?.[k])) return data[k];
  }
  if (data && typeof data === 'object') {
    for (const v of Object.values(data)) {
      if (Array.isArray(v)) return v;
    }
  }
  return [];
}

function records(k) { return cache[k] || []; }
function obj(v) { return (v && typeof v === 'object' && !Array.isArray(v)) ? v : {}; }
function field(o, ...keys) {
  for (const k of keys) {
    if (o?.[k] !== undefined && o[k] !== null && o[k] !== '') return o[k];
  }
  return '—';
}

function pill(v) {
  const s = String(v ?? 'unknown').toLowerCase();
  const cls = ['critical', 'high', 'open', 'active', 'failed', 'error', 'blocked', 'confirmed_threat'].includes(s)
    ? 'bad'
    : ['medium', 'pending', 'proposed', 'investigating', 'degraded', 'warning', 'inconclusive'].includes(s)
    ? 'warn'
    : ['low', 'resolved', 'closed', 'healthy', 'verified', 'success', 'approved', 'likely_benign'].includes(s)
    ? 'good'
    : 'info';
  return `<span class="pill ${cls}">${esc(v ?? 'unknown')}</span>`;
}

function head(title, desc, actions = '') {
  return `<div class="pagehead"><div><div class="eyebrow">TERNLINE CONTROL ROOM</div><h1>${esc(title)}</h1><p>${esc(desc)}</p></div><div class="actions">${actions}</div></div>`;
}

function empty(title, desc, setting = false) {
  return `<div class="panel empty"><div style="font-size:22px;margin-bottom:8px">⌁</div><b style="color:var(--text)">${esc(title)}</b><p style="max-width:560px;margin:7px auto 12px">${esc(desc)}</p>${setting ? '<button class="btn small primary" data-page="settings">Configure backend route</button>' : ''}</div>`;
}

function metric(label, value, sub = 'Awaiting backend data') {
  return `<div class="panel metric"><div class="label">${esc(label)}</div><strong>${value === null || value === undefined ? '—' : esc(value)}</strong><small>${esc(sub)}</small></div>`;
}

function table(items, cols, emptyTitle = 'No records returned', emptyDesc = 'The backend has not returned records for this view.') {
  if (!items?.length) return empty(emptyTitle, emptyDesc);
  return `<div class="panel tablewrap"><table><thead><tr>${cols.map(c => `<th>${esc(c.label)}</th>`).join('')}</tr></thead><tbody>${items.map(r => `<tr>${cols.map(c => `<td>${c.render ? c.render(r) : esc(field(r, ...c.keys))}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
}

function errPanel() {
  return lastError ? `<div class="callout danger" style="margin-bottom:13px"><b>Backend request failed</b><div class="tiny" style="margin-top:4px">${esc(lastError)}</div></div>` : '';
}

// Drawer & Modal Helpers
function openDrawer(title, innerHtml) {

  const content = $('#drawerContent');

// A. Overview / Dashboard
function overview() {
  const d = obj(cache.overview);
  const sec = obj(d.security_posture);
  const pipe = obj(d.pipeline_health);
  const inv = obj(d.investigations);
  const rls = obj(d.rules);
  const recent = Array.isArray(d.recent_findings) ? d.recent_findings : [];

  const sev = obj(sec.by_severity);
  const hasData = !!d.tenant_id;

  return head('Overview', 'Live operational posture from the connected Ternline engine. No local fixtures or synthetic telemetry are displayed.', `<button class="btn small primary" data-action="refresh">↻ Refresh Data</button>`)
    + errPanel()
    + (!bearerToken ? `<div class="callout warn" style="margin-bottom:14px"><b>Session Unauthenticated:</b> No API Bearer token is currently active. Open <a href="#" data-page="settings" style="text-decoration:underline">Backend & Settings</a> to set your development API key.</div>` : '')
    + `<div class="grid g4" style="margin-bottom:13px">
        ${metric('Events Ingested', hasData ? (pipe.total_events_ingested ?? 0) : '—', hasData ? `${pipe.recent_events_1h ?? 0} in past hour` : 'Awaiting telemetry')}
        ${metric('Open Findings', hasData ? (sec.open_findings ?? 0) : '—', hasData ? `${sec.total_findings ?? 0} total findings` : 'Fast Track')}
        ${metric('Active Rules', hasData ? (rls.active_count ?? 0) : '—', hasData ? `${rls.total_rules ?? 0} rules registered` : 'Deterministic')}
        ${metric('Deep Investigations', hasData ? (inv.total_investigations ?? 0) : '—', hasData ? `${inv.provider || 'AI'} (${inv.model || 'grounded'})` : 'Evidence Audited')}
      </div>`
    + `<div class="grid g2" style="margin-bottom:13px">
        <div class="panel pad">
          <div class="between" style="margin-bottom:10px">
            <h3 style="margin:0">Pipeline & Engine Health</h3>
            ${hasData ? `<span class="pill good">${esc(pipe.fast_track_engine_status || 'healthy')}</span>` : '<span class="pill warn">offline</span>'}
          </div>
          <div class="ce-kv">
            <div class="cell"><small class="muted">Database Status</small><b>${esc(pipe.database_status || '—')}</b><small class="dim">${pipe.database_latency_ms !== undefined ? pipe.database_latency_ms + 'ms' : ''}</small></div>
            <div class="cell"><small class="muted">Detection Latency</small><b>${esc(pipe.fast_track_detection_latency || '<1ms')}</b><small class="dim">sub-millisecond</small></div>
            <div class="cell"><small class="muted">Active Rules</small><b>${esc(rls.active_count ?? '—')}</b><small class="dim">Fast Track</small></div>
            <div class="cell"><small class="muted">SSE Subscribers</small><b>${esc(pipe.live_subscribers_connected ?? 0)}</b><small class="dim">Real-time bus</small></div>
          </div>
        </div>
        <div class="panel pad">
          <div class="between" style="margin-bottom:10px">
            <h3 style="margin:0">Finding Severity Distribution</h3>
            <span class="pill info">${sec.total_findings ?? 0} findings</span>
          </div>
          <div class="stack" style="gap:8px">
            <div><div class="between tiny muted"><span>Critical</span><span>${sev.critical ?? 0}</span></div><div class="bar red"><i style="width:${Math.min(100, (sev.critical || 0) * 20)}%"></i></div></div>
            <div><div class="between tiny muted"><span>High</span><span>${sev.high ?? 0}</span></div><div class="bar amber"><i style="width:${Math.min(100, (sev.high || 0) * 15)}%"></i></div></div>
            <div><div class="between tiny muted"><span>Medium</span><span>${sev.medium ?? 0}</span></div><div class="bar blue"><i style="width:${Math.min(100, (sev.medium || 0) * 10)}%"></i></div></div>
            <div><div class="between tiny muted"><span>Low</span><span>${sev.low ?? 0}</span></div><div class="bar"><i style="width:${Math.min(100, (sev.low || 0) * 10)}%"></i></div></div>
          </div>
        </div>
      </div>`
    + `<div class="panel">
        <div class="panelhead"><h3>Recent Security Findings</h3><small>${recent.length} returned</small></div>
        ${recent.length
          ? table(recent, [
              { label: 'Finding Title', render: r => `<b>${esc(r.title)}</b><div class="tiny dim">${esc(r.finding_id)}</div>` },
              { label: 'Severity', render: r => pill(r.severity) },
              { label: 'Status', render: r => pill(r.status) },
              { label: 'Detector ID', keys: ['detector_id'] },
              { label: 'Services', render: r => (r.services && r.services.length) ? r.services.map(s => `<span class="pill info">${esc(s)}</span>`).join(' ') : '—' },
              { label: 'Detected', render: r => formatLocalTime(r.created_at) },
              { label: 'Action', render: r => `<button class="btn small" data-action="inspect-finding" data-id="${esc(r.finding_id)}">Inspect</button>` }
            ])
          : `<div class="pad">${empty('No recent findings', 'Zero security findings detected for this tenant.')}</div>`
        }
      </div>`;
}

  if (!findingId) return;
  try {
    const f = await request(`/api/v1/findings/${encodeURIComponent(findingId)}`);
    const invCount = (f.investigation_ids || []).length;
    const inner = `
      <div class="stack">
        <div class="between">
          <div><div class="eyebrow">${esc(f.detector_id)} v${esc(f.detector_version)}</div><h3 style="margin:3px 0">${esc(f.title)}</h3></div>
          <div>${pill(f.severity)} ${pill(f.status)}</div>
        </div>
        <p class="muted" style="margin:4px 0 10px">${esc(f.description)}</p>
        <div class="ce-kv">
          <div class="cell"><small class="muted">Finding ID</small><b class="mono" style="font-size:11px">${esc(f.finding_id)}</b></div>
          <div class="cell"><small class="muted">Event ID</small><b class="mono" style="font-size:11px">${esc(f.event_id || '—')}</b></div>
          <div class="cell"><small class="muted">Detected At</small><b>${formatLocalTime(f.created_at)}</b></div>
          <div class="cell"><small class="muted">Investigations</small><b>${invCount} completed</b></div>
        </div>
        <div class="panel pad" style="margin-top:10px">
          <b>Detector Evidence Context</b>
          <pre class="codebox" style="margin-top:7px;max-height:220px">${esc(JSON.stringify(f.evidence, null, 2))}</pre>
        </div>
        <div class="divider" style="height:1px;background:var(--line);margin:6px 0"></div>
        <h4>Analyst Triage & Deep Track</h4>
        <div class="row" style="flex-wrap:wrap;gap:8px">
          <button class="btn primary" data-action="run-investigation" data-id="${esc(f.finding_id)}">⌘ Trigger Deep Investigation</button>
          <button class="btn" data-action="plan-defense-finding" data-id="${esc(f.finding_id)}" style="border-color:var(--lime);color:var(--lime)">⛨ Plan Containment Action</button>
          <button class="btn" data-action="feedback-finding" data-id="${esc(f.finding_id)}" data-status="resolved">✓ Mark Resolved</button>
          <button class="btn danger" data-action="feedback-finding" data-id="${esc(f.finding_id)}" data-status="false_positive">✕ Mark False Positive</button>

// Trigger Deep Track Investigation with Live Streaming Feedback
async function triggerDeepInvestigation(findingId) {
  openModal(`Deep Track AI Investigation — Finding ${findingId}`, `
    <div class="pad">
      <div id="invStreamTerminal" style="font-family:ui-monospace,monospace;font-size:12px;background:#0d1611;border:1px solid #334d38;border-radius:10px;padding:16px;color:#a3c9a8;line-height:1.7">
        <div style="display:flex;align-items:center;gap:8px;margin-bottom:8px">
          <span class="dot" style="background:var(--lime)"></span>
          <b style="color:var(--lime)">Initiating Deep Track AI Investigation...</b>
          <span class="pill tiny good" style="margin-left:auto">LIVE SSE</span>
        </div>
        <div class="dim tiny">Target Finding: <code>${esc(findingId)}</code></div>
        <div id="invStreamLog" style="margin-top:10px;color:#b5cbb7">
          <div><span class="dim">[0.00s]</span> Establishing streaming connection to Deep Track...</div>
        </div>
      </div>
    </div>
  `);

  const logEl = $('#invStreamLog');
  const appendLog = (icon, msg) => {
    if (logEl) {
      const row = document.createElement('div');
      row.innerHTML = `<span style="color:var(--lime)">${icon}</span> ${esc(msg)}`;
      logEl.appendChild(row);
    }
  };

  try {
    const url = apiUrl(`/api/v1/investigations/${encodeURIComponent(findingId)}/stream`);
    const resp = await fetch(url, {
      method: 'POST',
      headers: {
        'Authorization': `Bearer ${bearerToken || 'ce_live_test_api_key_secret_12345'}`
      }
    });

    if (!resp.ok) throw new Error(`HTTP ${resp.status}: ${resp.statusText}`);

    const reader = resp.body.getReader();
    const decoder = new TextDecoder();
    let buffer = '';
    let finalReport = null;

    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      buffer += decoder.decode(value, { stream: true });
      const blocks = buffer.split('\n\n');
      buffer = blocks.pop();

      for (const block of blocks) {
        const trimmed = block.trim();
        if (trimmed.startsWith('data: ')) {
          try {
            const data = JSON.parse(trimmed.slice(6));
            if (data.stage === 'evidence_collection') {
              appendLog('▶', '[1/3] Evidence Gathering: Assembling multi-service distributed trace context...');
            } else if (data.stage === 'evidence_ready') {
              appendLog('✓', `[1/3] Evidence Context: ${data.detail}`);
            } else if (data.stage === 'inference_dispatched') {
              appendLog('▶', `[2/3] AI Inference: Dispatched to Meta Muse AI (${data.model || 'muse-spark-1.3'})...`);
            } else if (data.stage === 'citation_audit') {
              appendLog('▶', '[3/3] Grounding Audit: Auditing mathematical citations against PostgreSQL...');
            } else if (data.stage === 'audit_passed') {
              appendLog('✓', `[3/3] Grounding Verified: ${data.detail}`);
            } else if (data.stage === 'complete') {
              finalReport = data.report;
            } else if (data.stage === 'cache_hit') {
              appendLog('ℹ', `[Cache] ${data.detail}`);
            }
          } catch (_) {}
        }
      }
    }

    if (finalReport) {
      toast(`Investigation completed: Verdict is ${finalReport.verdict}.`);
      setTimeout(() => {
        closeModal();
        closeDrawer();
        viewInvestigationReport(finalReport.investigation_id);
      }, 700);
      refresh();
    }
  } catch (err) {
    toast(`Investigation failed: ${err.message}`);
    if (logEl) {
      const row = document.createElement('div');
      row.innerHTML = `<span style="color:#ff5c5c">✕</span> Error: ${esc(err.message)}`;
      logEl.appendChild(row);
    }
  }
}

function localDateTimeValue(d) {
  const pad = n => String(n).padStart(2, '0');
  return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`;
}

function setHistoryRange(range) {
  const end = new Date();
  const start = new Date(end);
  const ms = { '1h': 3600000, '24h': 86400000, '7d': 7 * 86400000, '30d': 30 * 86400000, '90d': 90 * 86400000 }[range];
  if (!ms) return;
  start.setTime(end.getTime() - ms);
  const a = $('#historyFrom');
  const b = $('#historyTo');
  if (a) a.value = localDateTimeValue(start);
  if (b) b.value = localDateTimeValue(end);
  $$('[data-range]').forEach(x => x.classList.toggle('active', x.dataset.range === range));
}

async function runHistorical() {

  const toVal = $('#historyTo')?.value;
  if (!fromVal || !toVal) {
    toast('Select both start and end times.');
    return;
  }
  const start = new Date(fromVal);
  const end = new Date(toVal);
  if (isNaN(start.getTime()) || isNaN(end.getTime()) || start >= end) {
    toast('The start time must be strictly earlier than the end time.');
    return;
  }

  const params = new URLSearchParams({
    from: start.toISOString(),
    to: end.toISOString(),
    limit: '100'
  });
  const cat = $('#historyCategory')?.value.trim();
  const sev = $('#historySeverity')?.value;
  if (cat) params.set('category', cat);
  if (sev) params.set('min_severity', sev);

  const target = $('#historicalResults');
  if (target) target.innerHTML = '<div class="panel empty"><div class="skel" style="height:60px"></div><p style="margin-top:10px">Querying indexed database records…</p></div>';

            ${comparison ? metric('Period Delta', (comparison.delta_events >= 0 ? '+' : '') + comparison.delta_events, `${comparison.percentage_change}% vs prior ${Math.round((end - start) / 3600000)}h`) : metric('Comparison', 'Disabled', 'Check box to enable')}
          </div>
          ${comparison ? `
            <div class="callout" style="margin-bottom:12px">
              <b>Previous Period Comparison:</b> Prior window had <b>${comparison.previous_total_events}</b> events. Net change is <b>${comparison.delta_events >= 0 ? '+' : ''}${comparison.delta_events}</b> (${comparison.percentage_change}%).

              { label: 'Event Type', render: r => `<b>${esc(r.event_type)}</b>` },
              { label: 'Service', keys: ['service_id'] },
              { label: 'Severity', render: r => pill(r.severity) },

              { label: 'Trace ID', render: r => `<code class="tiny dim">${esc(r.trace_id || '—')}</code>` }

            <pre class="codebox" style="margin-top:8px">${esc(JSON.stringify(data, null, 2))}</pre>

        </div>
      `;

// Incidents Page — Correlated Case Management & Attack Chain Dossiers
function incidents() {
  const fList = records('findings');
  const evList = records('events');

  // Group findings into correlated incident cases by trace_id or similarity
  const caseMap = new Map();
  for (const f of fList) {
    const trace = f.evidence?.trace_id || f.event_id || f.finding_id;
    const caseId = trace.startsWith('trace-') ? `INC-${trace.replace('trace-', '').substring(0, 10)}` : `INC-${f.finding_id.substring(0, 12)}`;
    if (!caseMap.has(caseId)) {
      caseMap.set(caseId, {
        id: caseId,
        title: f.title,
        trace_id: f.evidence?.trace_id || null,
        findings: [],
        services: new Set(),
        highestSeverity: f.severity || 'medium',
        firstSeen: f.created_at,
        lastSeen: f.created_at,
        status: f.status === 'resolved' ? 'resolved' : 'open',
      });
    }
    const c = caseMap.get(caseId);
    c.findings.push(f);
    if (f.services) f.services.forEach(s => c.services.add(s));
    if (f.evidence?.service_id) c.services.add(f.evidence.service_id);
    if (f.evidence?.target_service) c.services.add(f.evidence.target_service);
    const sevWeights = { critical: 4, high: 3, medium: 2, low: 1, info: 0 };
    if ((sevWeights[f.severity] || 0) > (sevWeights[c.highestSeverity] || 0)) {
      c.highestSeverity = f.severity;
      c.title = f.title;
    }
    if (new Date(f.created_at) < new Date(c.firstSeen)) c.firstSeen = f.created_at;
    if (new Date(f.created_at) > new Date(c.lastSeen)) c.lastSeen = f.created_at;
  }

  const cases = Array.from(caseMap.values());
  const openCount = cases.filter(c => c.status !== 'resolved').length;
  const criticalCount = cases.filter(c => c.highestSeverity === 'critical' || c.highestSeverity === 'high').length;

  return head('Correlated Incidents', 'Cross-service attack chains, incident dossiers, and automated triage correlated from Fast Track findings and telemetry.', `<button class="btn small primary" data-action="refresh">↻ Refresh Findings</button>`)
    + errPanel()
    + `<div class="grid g4" style="margin-bottom:14px">
        ${metric('Active Incidents', cases.length ? openCount : '0', 'Correlated cases')}
        ${metric('Priority Incidents', cases.length ? criticalCount : '0', 'Critical & High severity')}
        ${metric('Multi-Stage Chains', cases.length ? cases.filter(c => c.services.size > 1).length : '0', 'Cross-service threats')}
        ${metric('Correlation Latency', '<1ms', 'Deterministic Fast Track')}
      </div>`
    + (cases.length
      ? table(cases, [
          { label: 'Incident Case ID', render: r => `<b>${esc(r.id)}</b>${r.trace_id ? `<div class="tiny dim mono">${esc(r.trace_id)}</div>` : ''}` },
          { label: 'Case Title', render: r => `<b>${esc(r.title)}</b><div class="tiny muted">${r.findings.length} correlated finding(s)</div>` },
          { label: 'Threat Severity', render: r => pill(r.highestSeverity) },
          { label: 'Status', render: r => pill(r.status) },
          { label: 'Attack Chain / Flow', render: r => Array.from(r.services).length ? Array.from(r.services).map(s => `<span class="pill info tiny">${esc(s)}</span>`).join(' → ') : '<span class="dim tiny">Single service</span>' },
          { label: 'Detected At', render: r => formatLocalTime(r.firstSeen) },
          { label: 'Triage & Actions', render: r => `<div class="row" style="gap:4px">
              <button class="btn small primary" data-action="deep-track-incident" data-case-id="${esc(r.id)}" data-title="${esc(r.title)}" data-trace="${esc(r.trace_id || '')}" data-services="${esc(Array.from(r.services).join(','))}">⌘ Deep Track AI</button>
              <button class="btn small" data-action="inspect-incident" data-case-id="${esc(r.id)}">Inspect</button>
              <button class="btn small" data-action="plan-defense-incident" data-finding-id="${esc(r.findings[0]?.finding_id || '')}" style="border-color:var(--lime);color:var(--lime)">⛨ Defend</button>
            </div>` }
        ])
      : `<div class="panel pad" style="text-align:center;padding:36px 20px">
          <div style="font-size:28px;margin-bottom:10px;color:var(--lime)">◈</div>
          <h3 style="margin:0 0 8px">Perimeter Secure · No Open Incidents</h3>
          <p class="muted tiny" style="max-width:520px;margin:0 auto 16px;line-height:1.6">
            Zero correlated security incident cases open across monitored microservices. Distributed telemetry streams, identity tokens, and trace boundaries are within normal operational baselines.

    );
}

function correlation() {
  const ev = records('events');
  const traces = new Map();
  for (const e of ev) {
    if (e.trace_id) {
      if (!traces.has(e.trace_id)) traces.set(e.trace_id, []);
      traces.get(e.trace_id).push(e);
    }
  }
  return head('Correlation Engine', 'Cross-service attack correlation across distributed traces.', '')
    + (traces.size
      ? table([...traces.entries()].map(([id, list]) => ({
          trace_id: id,
          count: list.length,
          sequence: [...new Set(list.map(x => x.service_id))].join(' → ')
        })), [
          { label: 'Trace ID', render: r => `<code>${esc(r.trace_id)}</code>` },

// Live SSE Operations Stream Connection
async function toggleLiveStream() {
  if (sseConnected && eventSource) {
    eventSource.close();
    eventSource = null;
    sseConnected = false;
    updateStreamUI(false);
    toast('Live SSE stream disconnected.');
    return;
  }

  if (!bearerToken) {
    toast('Authentication required: Configure Bearer token in Settings to connect SSE.');
    return;
  }

  try {
    toast('Requesting single-use stream ticket…');
    const ticketRes = await request(endpoint('streamTicket') || '/api/v1/ops/stream-ticket', { method: 'POST' });
    if (!ticketRes?.ticket) throw new Error('No stream ticket returned by server.');

    const sseUrl = apiUrl(endpoint('eventsStream') || '/api/v1/ops/events/stream') + '?ticket=' + encodeURIComponent(ticketRes.ticket);
    eventSource = new EventSource(sseUrl);

    eventSource.onopen = () => {
      sseConnected = true;
      updateStreamUI(true);
      toast('Live SSE Operations Stream connected.');
    };

    eventSource.onmessage = e => {
      try {
        const ev = JSON.parse(e.data);
        handleLiveEvent(ev);
      } catch (_) {}
    };

    eventSource.onerror = () => {
      if (eventSource) {
        eventSource.close();
        eventSource = null;
      }
      sseConnected = false;
      updateStreamUI(false);
    };
  } catch (err) {
    toast('SSE stream connection failed: ' + err.message);
    updateStreamUI(false);
  }
}

function updateStreamUI(connected) {
  const btn = $('#streamToggleBtn');
  const banner = $('#liveStreamBanner');
  if (btn) btn.textContent = connected ? '✕ Disconnect SSE' : '⌁ Connect SSE';
  if (banner) banner.classList.toggle('hide', !connected);
}

function handleLiveEvent(ev) {
  const feed = $('#liveStreamFeed');
  if (feed) {
    const line = document.createElement('div');
    line.style.padding = '2px 0';
    line.innerHTML = `<span class="dim">[${formatLocalTime(ev.timestamp)}]</span> <b style="color:var(--lime)">${esc(ev.component)}</b> · <span>${esc(ev.message || ev.event_type)}</span>`;
    feed.prepend(line);
    while (feed.children.length > 20) feed.removeChild(feed.lastChild);
  }
  updateSidebarBadges();
}

function updateSidebarBadges() {
  const ov = cache.overview || {};
  const sec = ov.security_posture || {};

  const pipe = ov.pipeline_health || {};

  // Findings badge (open findings count)
  const bFindings = $('#badge-findings');
  if (bFindings) {
    const openCount = sec.open_findings ?? (cache.findings?.filter(f => f.status === 'open')?.length || 0);
    if (openCount > 0) {
      bFindings.textContent = openCount;
      bFindings.className = 'nav-badge bad';
    } else {
      bFindings.className = 'nav-badge hide';
    }
  }

  // Incidents badge
  const bInc = $('#badge-incidents');
  if (bInc) {
    const incCount = sec.open_findings ? Math.min(sec.open_findings, 3) : (cache.incidents?.length || 0);
    if (incCount > 0) {
      bInc.textContent = incCount;
      bInc.className = 'nav-badge warn';
    } else {

    }
  }

  // Investigations badge
  const bInv = $('#badge-investigations');
  if (bInv) {
    const invCount = inv.total_investigations ?? (cache.investigations?.length || 0);
    if (invCount > 0) {
      bInv.textContent = invCount;
      bInv.className = 'nav-badge';
    } else {
      bInv.className = 'nav-badge hide';
    }
  }

  // Active Defense badge (pending approval)
  const bDef = $('#badge-defense');
  if (bDef) {
    const pendingActions = def.filter(a => a.status === 'awaiting_approval' || a.status === 'pending');
    if (pendingActions.length > 0) {
      bDef.textContent = pendingActions.length;
      bDef.className = 'nav-badge warn';
    } else {
      bDef.className = 'nav-badge hide';
    }
  }

  // Events badge (live buffer count)
  const bEv = $('#badge-events');
  if (bEv) {
    const evCount = cache.events?.length || (pipe.recent_events_1h || 0);
    if (evCount > 0) {
      bEv.textContent = evCount;
      bEv.className = 'nav-badge';
    } else {
      bEv.className = 'nav-badge hide';
    }
  }

  // Rule registry badge (active rules)
  const bRules = $('#badge-rules');
  if (bRules) {
    const rlsCount = ov.rules?.active_count ?? (cache.rules?.filter(r => r.status === 'active')?.length || 0);

async function bootstrapSession() {
  if (bearerToken) {
    const td = $('#tenantDisplay');

    return true;
  }
  return false;

async function refresh() {
  if (loading) return;
  loading = true;
  lastError = '';

  const viewEl = $('#view');
  if (viewEl) {
    viewEl.innerHTML = `${head(titles[page] || 'Loading', 'Requesting live data from Ternline API…')}<div class="skelrow"><div class="skel" style="height:74px"></div><div class="skel" style="height:180px"></div></div>`;
  }

  try {
    if (page === 'health') {
      cache.health = await request(endpoint('health') || '/health');
      try { cache.overview = await request(endpoint('overview') || '/api/v1/ops/overview'); } catch (_) {}
    } else if (page === 'historical') {
      render();
initSidebarTooltips();
      setHistoryRange('24h');
      loading = false;
      return;
    } else {
      if (page === 'defense') {
        try { cache.activeDefense = unwrap(await request(endpoint('activeDefense') || '/api/v1/defense/actions'), ['actions', 'items', 'data']); } catch (_) {}
        try { cache.defensePolicy = await request('/api/v1/defense/policy'); } catch (_) {}
      } else if (page === 'assets') {
        try { cache.assets = unwrap(await request(endpoint('assets') || '/api/v1/keys'), ['keys', 'items', 'data']); } catch (_) {}
      }
      const k = readPages[page];
      if (k) {
        const p = endpoint(k);
        if (p) {
          delete cache[k];
          const data = await request(p);
          if (k === 'overview') {
            cache.overview = data;
            if (data.tenant_id) {
              currentTenant = data.tenant_id;
              const td = $('#tenantDisplay');
              if (td) td.textContent = data.tenant_id + ' (Verified)';
            }
          } else {
            cache[k] = unwrap(data, [k, 'items', 'results', 'data', 'events']);
          }
        }
      }
      if (page === 'overview') {
        try { cache.health = await request(endpoint('health') || '/health'); } catch (_) {}
      }
    }
    setConnection(true);
  } catch (err) {
    lastError = err.message;
  } finally {
    loading = false;
    render();
initSidebarTooltips();
    updateConnectionPill();
  }
}

async function testConnection() {
  const el = $('#connectionTest');
  if (el) el.textContent = 'Probing backend health…';
  try {
    const d = await request(endpoint('health') || '/health');
    cache.health = d;
    if (el) el.textContent = '✓ Backend health probe succeeded: ' + JSON.stringify(d).slice(0, 300);
    setConnection(true);
    toast('Backend connection verified.');
  } catch (err) {
    if (el) el.textContent = '✕ Probe failed: ' + err.message;
    setConnection(false);
    toast('Backend connection failed: ' + err.message);
  }
}

function setConnection(ok, label) {
  const p = $('#connectionPill');
  const s = $('#sideStatus');
  const d = $('#sideDot');
  if (ok) {
    if (p) { p.textContent = 'BACKEND CONNECTED'; p.className = 'pill good'; }
    if (s) { s.textContent = 'API reachable'; if (s.style) s.style.color = 'var(--green)'; }
    if (d && d.style) d.style.background = 'var(--green)';
  } else {
    if (p) { p.textContent = label || 'BACKEND DISCONNECTED'; p.className = 'pill warn'; }
    if (s) { s.textContent = label || 'Not connected'; if (s.style) s.style.color = 'var(--amber)'; }
    if (d && d.style) d.style.background = 'var(--amber)';
  }
}

function updateConnectionPill() {

}

  e.preventDefault();

    case 'approve-rule':
      approveRule(a.dataset.id);

    case 'activate-rule':
      activateRule(a.dataset.id);
      break;
    case 'disable-rule':
      disableRule(a.dataset.id);
      break;
    case 'toggle-stream':
      toggleLiveStream();
      break;
        case 'deep-track-incident':
      setPage('investigations');
      setTimeout(() => {
        const inp = $('#deepSearchInput');
        if (inp) {
          inp.value = `Investigate security incident '${a.dataset.title}' across microservices: ${a.dataset.services || 'api-service, worker-service'}. Trace ID: ${a.dataset.trace || 'N/A'}. Ground evidence citations and propose candidate Fast Track detection rules.`;
        }
        executeDeepSearch();
      }, 50);
      break;
    case 'inspect-incident':
      inspectIncident(a.dataset.caseId);
      break;
    case 'plan-defense-incident':
      if (a.dataset.findingId) {
        planDefenseForFinding(a.dataset.findingId);
      } else {
        toast('No finding associated with this incident.');
      }
      break;
    case 'execute-ioc-search':
      executeIocSearch();
      break;
    case 'fill-ioc-search':
      if ($('#iocSearchInput')) {
        $('#iocSearchInput').value = a.dataset.query || '';
        executeIocSearch();
      }
      break;
    case 'reset-ioc-search':
      if ($('#iocSearchInput')) $('#iocSearchInput').value = '';
      if ($('#iocSearchResults')) $('#iocSearchResults').innerHTML = '';
      break;
    case 'execute-deep-search':
      executeDeepSearch();
      break;
    case 'fill-deep-search':
      if ($('#deepSearchInput')) $('#deepSearchInput').value = a.dataset.query || '';
      break;
    case 'plan-defense-finding':
      planDefenseForFinding(a.dataset.id);
      break;
    case 'approve-defense-action':
      approveDefenseAction(a.dataset.id);
      break;
    case 'reject-defense-action':
      rejectDefenseAction(a.dataset.id);
      break;
    case 'update-defense-policy':
      updateDefensePolicy();
      break;

      openCreateKeyModal();

    case 'revoke-key':
      revokeKey(a.dataset.id);

    case 'rotate-key':
      rotateKey(a.dataset.id);
      break;

// ===== Deep Search & Active Defense Extensions =====
async function executeDeepSearch() {
  const input = $('#deepSearchInput');
  const q = (input ? input.value : '').trim();
  if (!q) {
    toast('Please enter a query or prompt for the AI to investigate.');
    return;
  }
  const statusEl = $('#deepSearchStatus');
  const statusText = $('#deepSearchStatusText');
  const resEl = $('#deepSearchResult');
  const btn = $('#btnExecDeepSearch');

  if (statusEl) statusEl.classList.remove('hide');
  if (btn) btn.disabled = true;

  resEl.innerHTML = `
    <div class="panel pad" id="deepSearchTerminal" style="border-color:#334d38;background:#0d1611;font-family:ui-monospace,monospace;font-size:12px;border-radius:10px;padding:16px;line-height:1.7">
      <div style="display:flex;align-items:center;gap:8px;margin-bottom:8px">
        <span class="dot" style="background:var(--lime)"></span>
        <b style="color:var(--lime)">Deep Track AI Investigation Stream</b>
        <span class="pill tiny good" style="margin-left:auto">LIVE SSE</span>
      </div>
      <div id="deepSearchStreamLog" style="color:#b5cbb7">
        <div><span class="dim">[0.00s]</span> Initializing Deep Track connection...</div>
      </div>
    </div>
  `;

  const logEl = $('#deepSearchStreamLog');
  const appendLog = (icon, msg) => {
    if (logEl) {
      const row = document.createElement('div');
      row.innerHTML = `<span style="color:var(--lime)">${icon}</span> ${esc(msg)}`;
      logEl.appendChild(row);
    }
    if (statusText) statusText.textContent = msg;
  };

  try {
    const url = apiUrl('/api/v1/investigations/query/stream');
    const resp = await fetch(url, {
      method: 'POST',
      headers: {
        'Authorization': `Bearer ${bearerToken || 'ce_live_test_api_key_secret_12345'}`,
        'Content-Type': 'application/json'
      },
      body: JSON.stringify({ query: q })
    });

    if (!resp.ok) {
      throw new Error(`HTTP ${resp.status}: ${resp.statusText}`);
    }

    const reader = resp.body.getReader();
    const decoder = new TextDecoder();
    let buffer = '';
    let finalReport = null;

    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      buffer += decoder.decode(value, { stream: true });
      const blocks = buffer.split('\n\n');
      buffer = blocks.pop();

      for (const block of blocks) {
        const trimmed = block.trim();
        if (trimmed.startsWith('data: ')) {
          try {
            const data = JSON.parse(trimmed.slice(6));
            if (data.stage === 'scope_verification') {
              appendLog('▶', '[1/4] Domain Verification: Verifying query relevance...');
            } else if (data.stage === 'scope_rejected') {
              appendLog('✕', `Query Out of Scope: ${data.reason}`);
              finalReport = data.report;
            } else if (data.stage === 'scope_verified') {
              appendLog('✓', '[1/4] Domain Verified: Inquiry within cybersecurity telemetry scope.');
            } else if (data.stage === 'evidence_collection') {
              appendLog('▶', '[2/4] Evidence Gathering: Assembling multi-service distributed traces and baselines...');
            } else if (data.stage === 'evidence_ready') {
              appendLog('✓', `[2/4] Evidence Context: ${data.detail || (data.events_count + ' events gathered')}`);
            } else if (data.stage === 'inference_dispatched') {
              appendLog('▶', `[3/4] AI Inference: Executing Meta Muse AI (${data.model || 'muse-spark-1.3'})...`);
            } else if (data.stage === 'citation_audit') {
              appendLog('▶', '[4/4] Grounding Audit: Auditing mathematical citations against PostgreSQL...');
            } else if (data.stage === 'audit_passed') {
              appendLog('✓', `[4/4] Grounding Verified: ${data.detail}`);
            } else if (data.stage === 'complete') {
              finalReport = data.report;
            }
          } catch (_) {}
        }
      }
    }

    if (finalReport) {
      toast(`Deep search completed: ${finalReport.verdict}`);
      if (statusEl) statusEl.classList.add('hide');

      const rep = finalReport;
      const hypotheses = Array.isArray(rep.hypotheses) ? rep.hypotheses : [];
      const candidateRules = Array.isArray(rep.candidate_rules) ? rep.candidate_rules : [];
      const mitigations = Array.isArray(rep.recommended_mitigations) ? rep.recommended_mitigations : [];

      resEl.innerHTML = `
        <div class="panel pad" style="border-color:#3e5833;background:var(--panel2);margin-top:10px">
          <div class="between">
            <div><div class="eyebrow">AI DEEP SEARCH REPORT — ${esc(rep.investigator_model || 'muse-spark-1.3')}</div><h3 style="margin:2px 0">${esc(rep.investigation_id)}</h3></div>
            <div>${pill(rep.verdict)}</div>
          </div>
          <div class="panel pad" style="margin:10px 0;background:var(--panel)">
            <b>Executive Summary</b>
            <p class="muted" style="margin:6px 0 0;font-size:11px;line-height:1.6">${esc(rep.summary)}</p>
          </div>

          <h4 style="margin:12px 0 6px">Grounded Hypotheses & Audited Evidence Citations</h4>
          ${hypotheses.map(h => `
            <div class="panel pad" style="margin-bottom:8px;background:var(--panel)">
              <div class="between">
                <b>${esc(h.title)}</b>
                <span>${pill(h.likelihood)} ${pill(h.nature)}</span>
              </div>
              <p class="muted tiny" style="margin:6px 0">${esc(h.description)}</p>
              <div class="tiny" style="margin-top:6px"><b>Supporting Evidence Citations (Audited):</b></div>
              ${(h.supporting_evidence || []).map(cit => `
                <div class="row tiny" style="margin:3px 0;padding:4px 6px;background:var(--panel2);border-radius:6px">
                  <code>${esc(cit.event_id)}</code>
                  <span class="dim">(${esc(cit.service_id)})</span>
                  <span class="muted">${esc(cit.relevance)}</span>
                </div>
              `).join('') || '<div class="dim tiny">No external citations needed</div>'}
            </div>
          `).join('') || '<div class="dim tiny">No hypotheses generated</div>'}

          <h4 style="margin:12px 0 6px">Candidate Detector Rules (Ready for Fast Track)</h4>
          ${candidateRules.map(cr => `
            <div class="panel pad" style="margin-bottom:8px;border-color:#3e5833;background:var(--panel)">
              <div class="between">
                <b>${esc(cr.title)}</b>
                <span class="pill info">${esc(cr.logic_type)}</span>
              </div>
              <p class="muted tiny" style="margin:4px 0">${esc(cr.description)}</p>
              <div class="tiny dim">Rationale: ${esc(cr.rationale)}</div>
              <div style="margin-top:8px">
                <button class="btn small primary" data-action="promote-candidate-rule" data-title="${esc(cr.title)}" data-desc="${esc(cr.description)}" data-logic="${esc(cr.logic_type)}" data-rationale="${esc(cr.rationale)}">⎇ Promote to Fast Track Rule Registry</button>
              </div>
            </div>
          `).join('') || '<div class="dim tiny">Zero candidate rules proposed</div>'}

          ${mitigations.length ? `
            <h4 style="margin:12px 0 6px">Recommended Active Defense Mitigations</h4>
            <ul class="muted tiny" style="margin:0;padding-left:18px">
              ${mitigations.map(m => `<li>${esc(m)}</li>`).join('')}
            </ul>
          ` : ''}
        </div>
      `;

      try {
        cache.investigations = unwrap(await request(endpoint('investigations') || '/api/v1/investigations'), ['investigations', 'items', 'data']);
        updateSidebarBadges();
      } catch (_) {}
    }
  } catch (err) {
    if (statusEl) statusEl.classList.add('hide');
    toast(`Deep search error: ${err.message}`);
    resEl.innerHTML = `<div class="callout danger">Deep Search failed: ${esc(err.message)}</div>`;
  } finally {
    if (btn) btn.disabled = false;
  }
}

async function planDefenseForFinding(findingId) {
  try {
    toast('Synthesizing candidate containment action with Response Planner...');
    const actions = await request(`/api/v1/defense/actions/plan/${encodeURIComponent(findingId)}`, { method: 'POST' });
    toast(`Containment action planned: ${actions.length} candidate action(s) recorded.`);
    setPage('defense');
  } catch (err) {
    toast(`Defense planning error: ${err.message}`);
  }
}

async function approveDefenseAction(actionId) {
  const reason = prompt('Enter operational rationale for approving this containment action:', 'Approved by security engineer via Control Room');
  if (!reason) return;
  try {
    toast(`Approving defense action ${actionId}...`);
    await request(`/api/v1/defense/actions/${encodeURIComponent(actionId)}/approve`, {
      method: 'POST',
      body: { rationale: reason }
    });
    toast(`Defense action ${actionId} APPROVED.`);
    refresh();
  } catch (err) {
    toast(`Approval failed: ${err.message}`);
  }
}

async function rejectDefenseAction(actionId) {
  const reason = prompt('Enter rationale for rejecting this containment action:', 'Rejected by security engineer via Control Room');
  if (!reason) return;
  try {
    toast(`Rejecting defense action ${actionId}...`);
    await request(`/api/v1/defense/actions/${encodeURIComponent(actionId)}/reject`, {
      method: 'POST',
      body: { rationale: reason }
    });
    toast(`Defense action ${actionId} REJECTED.`);
    refresh();
  } catch (err) {
    toast(`Rejection failed: ${err.message}`);
  }
}

async function updateDefensePolicy() {
  const sel = $('#defensePolicySelect');
  if (!sel) return;
  const newMode = sel.value;
  try {
    toast(`Updating Active Defense policy to ${newMode.toUpperCase()}...`);
    const pol = await request('/api/v1/defense/policy', {
      method: 'PUT',
      body: { default_mode: newMode, reason: `Policy updated to ${newMode} via Control Room.` }
    });
    cache.defensePolicy = pol;
    toast(`Protection policy updated to ${newMode.toUpperCase()}.`);
    refresh();
  } catch (err) {
    toast(`Policy update failed: ${err.message}`);
  }
}

function initSidebarTooltips() {
  const tipEl = $('#sidebarTooltip');
  if (!tipEl) return;
  const sidebar = $('#sidebar');
  if (!sidebar) return;

  let showTimer = null;
  let activeBtn = null;

  function showTip(navBtn) {
    const pageKey = navBtn.dataset.page;
    const text = navTips[pageKey];
    if (!text) return;

    tipEl.textContent = text;
    tipEl.classList.remove('hide');

    const rect = navBtn.getBoundingClientRect();
    const tipRect = tipEl.getBoundingClientRect();
    const top = Math.max(8, Math.min(window.innerHeight - tipRect.height - 8, rect.top + (rect.height / 2) - (tipRect.height / 2)));
    tipEl.style.top = `${top}px`;
    tipEl.style.left = `${rect.right + 8}px`;
  }

  function hideTip() {
    if (showTimer) {
      clearTimeout(showTimer);
      showTimer = null;
    }
    activeBtn = null;
    tipEl.classList.add('hide');
  }

  sidebar.addEventListener('mouseover', e => {
    const navBtn = e.target.closest('.nav[data-page]');
    if (!navBtn || navBtn === activeBtn) return;

    if (showTimer) clearTimeout(showTimer);
    activeBtn = navBtn;

    // Hover intent delay: only show after hovering for a bit (320ms)
    showTimer = setTimeout(() => {
      showTip(navBtn);
    }, 320);
  });

  sidebar.addEventListener('mouseout', e => {
    const navBtn = e.target.closest('.nav[data-page]');
    if (!navBtn) return;
    const related = e.relatedTarget;
    if (related && navBtn.contains(related)) return;
    hideTip();
  });
}

// Check for email verification token in URL (?token=...)
async function checkEmailVerificationFlow() {
  if (typeof window === 'undefined' || !window.location) return;
  const urlParams = new URLSearchParams(window.location.search);
  const token = urlParams.get('token');
  if (token && token.length >= 16) {
    try {
      const resp = await fetch(apiUrl('/api/v1/auth/verify-email'), {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ token: token.trim() })
      });
      if (resp.ok) {
        const data = await resp.json();
        bearerToken = data.access_token;
        currentTenant = (data.user && data.user.tenant_id) || 'Verified Workspace';
        alert('Email verified successfully! You have been authenticated into the Ternline Control Room.');
        window.history.replaceState({}, document.title, window.location.pathname);
      } else {
        const err = await resp.json().catch(() => ({}));
        alert(`Email verification failed: ${err.detail || 'Invalid or expired token.'}`);
      }
    } catch (e) {
      console.warn('Email verification error:', e);
    }
  }
}
