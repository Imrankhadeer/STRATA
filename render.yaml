services:
  - type: web
    name: ternline-cyber-engine
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: alembic upgrade head && uvicorn backend.main:app --host 0.0.0.0 --port $PORT --workers 1
    plan: starter
    region: oregon
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: cyber-engine-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: cyber-engine-redis
          property: connectionString
      - key: REDIS_REQUIRED
        value: "false"
      - key: WORKERS
        value: "1"
      - key: INVESTIGATOR_PROVIDER
        value: muse
      - key: INVESTIGATOR_MODEL
        value: muse-spark-1.3
      - key: INVESTIGATOR_BASE_URL
        value: https://api.meta.ai/v1
      - key: INVESTIGATOR_API_KEY
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: INITIAL_ADMIN_API_KEY
        generateValue: true
      - key: INITIAL_TENANT_ID
        value: tenant-alpha
      - key: ALLOW_SIMULATION_API
        value: "false"
      - key: ALLOWED_CORS_ORIGINS
        value: https://ternline-cyber-engine.onrender.com,https://ternline.vercel.app
      # CORS_ALLOW_VERCEL must be false in production (startup validator enforces this).
      # Frontend origin is covered by ALLOWED_CORS_ORIGINS above.
      - key: CORS_ALLOW_VERCEL
        value: "false"
      - key: FRONTEND_URL
        value: https://ternline.vercel.app

  - type: redis
    name: cyber-engine-redis
    plan: starter
    region: oregon
    maxmemoryPolicy: volatile-lru
    ipAllowList: []

databases:
  - name: cyber-engine-postgres
    plan: starter
    databaseName: cyber_engine
    user: postgres
    region: oregon
